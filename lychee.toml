# Lychee link checker configuration
# Docs: https://lychee.cli.rs/usage/config/
#
# NOTE: broken-links.yml pins lychee 0.14.0 (lychee-action@v1.9.0), which
# silently ignores two settings if they are put in this file:
#   - `accept` is parsed but never applied -> use --accept in broken-links.yml.
#   - `exclude` is dropped whenever the command line has any --exclude flag
#     -> list URLs to skip in .lycheeignore.

# Retries. lychee 0.14.0 does not retry 503 responses (it makes a single
# request), so transient 5xx errors are covered by --accept instead.
max_retries = 3
retry_wait_time = 5

# Wait longer before giving up on slow hosts
timeout = 30

# Pretend to be a normal browser — many hosts 403 unknown UAs
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# Follow redirects
max_redirects = 10
